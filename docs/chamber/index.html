<!doctype html>
<html lang="nl" class="overscroll-x-none [overflow-x:clip]">

<head>
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas at the Great Hall | Chamber of Secrets</title>
    <link rel="icon" href="./favicon.ico">
    <link rel="stylesheet" href="./css/main.css?v=815a25f504">
    <script src="./js/audio-toggle.js?v=815a25f504"></script>
    <script src="./js/smooth-scroll.js?v=815a25f504" defer></script>
    <script type="module" src="./js/chamber.js?v=815a25f504"></script>
    <script src="./js/background-audio.js?v=815a25f504" defer></script>
</head>

<body
    class="relative max-h-dvh touch-pan-y overscroll-x-none [overflow-x:clip] overflow-y-hidden bg-neutral-950 font-serif text-amber-50 antialiased" data-asset-base-path="../">
    <audio id="background-audio" preload="auto" loop autoplay>
        <source src="./assets/music/dueling-the-basilisk.mp3" type="audio/mp3">
    </audio>

    <div id="sorting-backdrop" aria-hidden="true"
        class="pointer-events-none fixed inset-0 z-0 origin-center bg-[url('../assets/images/chamber/background-1.png')] bg-cover bg-center bg-no-repeat animate-fadeIn1800">
    </div>
    <div id="sorting-backdrop-house" aria-hidden="true"
        class="pointer-events-none fixed inset-0 z-[1] origin-center bg-[url('../assets/images/chamber/background-2.png')] bg-cover bg-center bg-no-repeat opacity-0 animate-backdropGlow">
    </div>

    <div id="sorting-backdrop-final" aria-hidden="true"
        class="pointer-events-none fixed inset-0 z-[2] origin-center bg-[url('../assets/images/chamber/background-3.png')] bg-cover bg-center bg-no-repeat opacity-0 transition-opacity ease-out">
    </div>

    <div id="sorting-overlay" aria-hidden="true"
        class="pointer-events-none fixed inset-0 z-[2] bg-gradient-to-b from-transparent via-black/70 to-black animate-fadeIn1800">
    </div>

</body>

</html>
